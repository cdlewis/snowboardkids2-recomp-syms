name: Regenerate symbols

on:
  repository_dispatch:
    types: [decomp-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regenerate-symbols
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Resolve decomp commit
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: 'cdlewis', repo: 'snowboardkids2-decomp', ref: 'main'
            });
            const requested = context.payload.client_payload?.sha;
            if (context.eventName === 'repository_dispatch' && requested !== data.sha) {
              core.notice('Skipping a superseded decomp update.');
              core.setOutput('current', 'false');
              return;
            }
            core.setOutput('sha', data.sha);
            core.setOutput('current', 'true');

      - name: Checkout symbol tooling
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          path: symbols
          persist-credentials: false

      - name: Checkout exact decomp commit
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          repository: cdlewis/snowboardkids2-decomp
          ref: ${{ steps.source.outputs.sha }}
          submodules: recursive
          path: decomp
          persist-credentials: false

      - name: Checkout private baserom
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          repository: cdlewis/snowboardkids2-private
          token: ${{ secrets.PRIVATE_REPO_ACCESS }}
          path: baserom
          persist-credentials: false

      - name: Checkout pinned N64Recomp
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          repository: N64Recomp/N64Recomp
          ref: ffb39cdad1da5de07eaaa48bd1db4a89a7986771
          submodules: recursive
          path: recompiler
          persist-credentials: false

      - name: Install system packages
        if: steps.source.outputs.current == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libdbus-1-dev gobject-introspection libgirepository1.0-dev libcups2-dev binutils-mips-linux-gnu

      - name: Set up Python
        if: steps.source.outputs.current == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decrypt baserom on runner
        if: steps.source.outputs.current == 'true'
        env:
          BASEROM_KEY: ${{ secrets.BASEROM_KEY }}
        run: |
          gpg --quiet --batch --yes --decrypt --passphrase "$BASEROM_KEY" \
            --output decomp/snowboardkids2.z64 baserom/snowboardkids2.z64.gpg

      - name: Check symbol merging
        if: steps.source.outputs.current == 'true'
        run: python3 -m unittest discover -s symbols/scripts -v

      - name: Build and verify matching decomp
        if: steps.source.outputs.current == 'true'
        working-directory: decomp
        run: |
          make setup
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          export PATH="$PWD/.venv/bin:$PATH"
          make extract
          make

      - name: Build N64Recomp
        if: steps.source.outputs.current == 'true'
        run: |
          cmake -S recompiler -B "$RUNNER_TEMP/recompiler-build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/recompiler-build" --target N64RecompCLI --parallel 2

      - name: Generate symbols
        if: steps.source.outputs.current == 'true'
        run: |
          python3 symbols/scripts/generate_symbols.py \
            --elf decomp/build/snowboardkids2.elf \
            --recompiler "$RUNNER_TEMP/recompiler-build/N64Recomp" \
            --output "$RUNNER_TEMP/generated-symbols"

      - name: Checkout latest symbols for publishing
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish

      - name: Commit changed symbol dumps
        if: steps.source.outputs.current == 'true'
        working-directory: publish
        env:
          DECOMP_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/cdlewis/snowboardkids2-decomp/commits/main --jq .sha)
          if [ "$latest" != "$DECOMP_SHA" ]; then
            echo 'Decomp advanced during the build; skipping superseded symbols.'
            exit 0
          fi
          if ! cmp -s manual_symbols.toml ../symbols/manual_symbols.toml; then
            echo 'Manual symbols changed during the build; rerun the workflow.' >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/generated-symbols/dump.toml" dump.toml
          cp "$RUNNER_TEMP/generated-symbols/data_dump.toml" data_dump.toml
          git add -- dump.toml data_dump.toml
          if git diff --cached --quiet; then
            echo 'Symbols are already up to date.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update symbols against decomp ${DECOMP_SHA:0:12}"
          git push origin HEAD:main

      # No ELF, ROM, extracted assets, or build caches are uploaded.
